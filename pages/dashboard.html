<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard - Inventario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      primary: { DEFAULT: '#1E3A8A', dark: '#152a63', light: '#3b5bc0' },
      accent: '#F59E0B'
    } } } };
  </script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="app-layout">
    <div id="app-navbar"></div>

    <div class="main-content">
      <div class="main-inner">
        <div class="page-header">
          <div>
            <h1 class="page-title">Dashboard</h1>
            <p class="page-subtitle">Resumen general del inventario</p>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="card metric-card">
            <div>
              <div class="metric-label">Total productos</div>
              <div id="total-productos" class="metric-value">0</div>
            </div>
            <div class="metric-icon" style="background:#e0e7ff;color:#1E3A8A;">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25M21 7.5v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" /></svg>
            </div>
          </div>

          <div class="card metric-card">
            <div>
              <div class="metric-label">Stock bajo</div>
              <div id="stock-bajo" class="metric-value">0</div>
            </div>
            <div class="metric-icon" style="background:#fee2e2;color:#991b1b;">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" /></svg>
            </div>
          </div>

          <div class="card metric-card">
            <div>
              <div class="metric-label">Movimientos hoy</div>
              <div id="movimientos-hoy" class="metric-value">0</div>
            </div>
            <div class="metric-icon" style="background:#fef3c7;color:#92400e;">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initNavbar } from '../js/components/navbar.js';
    import { initDashboard } from '../js/controllers/dashboardController.js';
    initNavbar();
    initDashboard();
  </script>
</body>
</html>
