<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Productos - Inventario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      primary: { DEFAULT: '#1E3A8A', dark: '#152a63', light: '#3b5bc0' },
      accent: '#F59E0B'
    } } } };
  </script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="app-layout">
    <div id="app-navbar"></div>

    <div class="main-content">
      <div class="main-inner">
        <div class="page-header">
          <div>
            <h1 class="page-title">Productos</h1>
            <p class="page-subtitle">Gestiona el catálogo y el stock disponible</p>
          </div>
        </div>

        <section class="mb-6">
          <div class="card">
            <h2 class="font-semibold mb-3">Crear producto</h2>
            <form id="producto-form" class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div class="field">
                <label class="field-label">Nombre</label>
                <input name="nombre" placeholder="Ej. Tornillo M4" required />
              </div>
              <div class="field">
                <label class="field-label">Precio</label>
                <input name="precio" placeholder="0.00" type="number" step="0.01" min="0" required />
              </div>
              <div class="field">
                <label class="field-label">Stock inicial</label>
                <input name="stock" placeholder="0" type="number" min="0" required />
              </div>
              <div class="field">
                <label class="field-label">Stock mínimo</label>
                <input name="stockMinimo" placeholder="0" type="number" min="0" required />
              </div>
              <div class="field">
                <label class="field-label">Categoría</label>
                <select name="categoriaId">
                  <option value="">-- Categoría --</option>
                </select>
              </div>
              <div class="field">
                <label class="field-label">Descripción</label>
                <textarea name="descripcion" placeholder="Descripción (opcional)" rows="1"></textarea>
              </div>

              <div class="md:col-span-2 flex flex-col sm:flex-row sm:items-end gap-3 pt-1 border-t border-slate-100 mt-1">
                <button class="btn-primary">Crear producto</button>
                <div class="flex-1 flex gap-2">
                  <input id="categoria-nombre" placeholder="Nueva categoría" class="flex-1" />
                  <button id="btn-add-categoria" type="button" class="btn-ghost whitespace-nowrap">Agregar categoría</button>
                </div>
              </div>
              <div class="md:col-span-2">
                <div id="producto-msg" class="alert alert-error hidden"></div>
              </div>
            </form>
          </div>
        </section>

        <section>
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-3">
            <h2 class="font-semibold">Listado de productos</h2>
            <div class="flex flex-col sm:flex-row gap-2">
              <input id="search-nombre" placeholder="Buscar por nombre" />
              <select id="filter-categoria"><option value="">Todas las categorías</option></select>
            </div>
          </div>

          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Nombre</th><th>Precio</th><th>Stock</th><th>Stock mín.</th><th>Descripción</th><th>Alerta</th><th>Acciones</th>
                </tr>
              </thead>
              <tbody id="productos-tbody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </div>

  <!-- Modal editar producto -->
  <div id="modal-edit" class="hidden modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <h3>Editar producto</h3>
      <form id="edit-form" class="grid grid-cols-1 gap-3 mt-2">
        <div class="field">
          <label class="field-label">Nombre</label>
          <input name="nombre" required />
        </div>
        <div class="field">
          <label class="field-label">Precio</label>
          <input name="precio" type="number" step="0.01" min="0" required />
        </div>
        <div class="field">
          <label class="field-label">Stock</label>
          <input name="stock" type="number" min="0" required />
        </div>
        <div class="field">
          <label class="field-label">Stock mínimo</label>
          <input name="stockMinimo" type="number" min="0" required />
        </div>
        <div class="field">
          <label class="field-label">Categoría</label>
          <select name="categoriaId"><option value="">-- Categoría --</option></select>
        </div>
        <div class="field">
          <label class="field-label">Descripción</label>
          <textarea name="descripcion" rows="2"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" id="edit-cancel" class="btn-ghost">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar cambios</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal confirmar eliminación (embebido, sin fetch, funciona con file://) -->
  <div id="confirm-delete-modal" class="hidden modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <h3>Confirmar eliminación</h3>
      <p>¿Estás seguro de que deseas eliminar este producto? Esta acción no se puede deshacer.</p>
      <div class="modal-actions">
        <button class="confirm-no btn-ghost" type="button">Cancelar</button>
        <button class="confirm-yes btn-danger-solid" type="button">Eliminar</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initNavbar } from '../js/components/navbar.js';
    import { initProductos } from '../js/controllers/productosController.js';
    initNavbar();
    initProductos();
  </script>
</body>
</html>
