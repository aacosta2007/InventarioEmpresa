<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Iniciar sesión - Inventario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#1E3A8A', dark: '#152a63', light: '#3b5bc0' },
            accent: '#F59E0B'
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-card-top">
        <div class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25M21 7.5v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" /></svg>
        </div>
        <h1 class="text-xl font-bold">Inventario Corporativo</h1>
        <p class="text-sm text-white/80 mt-1">Controla productos, stock y movimientos en un solo lugar.</p>
      </div>

      <div class="login-card-body">
        <form id="login-form" class="space-y-4">
          <div class="field">
            <label class="field-label">Usuario</label>
            <input name="username" required autocomplete="username" />
          </div>
          <div class="field">
            <label class="field-label">Contraseña</label>
            <input name="password" type="password" required autocomplete="current-password" />
          </div>
          <div id="login-msg" class="alert alert-error hidden"></div>
          <button class="btn-primary w-full justify-center">Entrar</button>
        </form>

        <div class="login-demo mt-5">
          <strong>Credenciales de prueba</strong><br>
          Administrador: <strong>admin</strong> / admin123<br>
          Empleado: <strong>empleado</strong> / empleado123
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initLogin } from '../js/controllers/loginController.js';
    initLogin();
  </script>
</body>
</html>
